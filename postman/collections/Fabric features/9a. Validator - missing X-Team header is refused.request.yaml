$kind: http-request
description: "Route anthropic-validated has the validator plugin: every request must carry an X-Team header, so each call can be charged to a team. Without it Fabric answers 422."
url: "{{fabricUrl}}/anthropic-validated/v1/messages"
method: POST
headers:
  Content-Type: "application/json"
  anthropic-version: "2023-06-01"
  fg-api-key: "{{fabricKey}}"
body:
  type: json
  content: |-
    {
      "model": "claude-haiku-4-5-20251001",
      "max_tokens": 40,
      "messages": [
        {
          "role": "user",
          "content": "Say hi"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 9000
