$kind: http-request
description: "Used to return 502: the Transformer ran on every request of the route, including GETs with no body. Fixed on 2026-10-21 by matching the plugin only on path prefix /anthropic-economy/v1/messages and method POST. Now 200."
url: "{{fabricUrl}}/anthropic-economy/v1/models"
method: GET
headers:
  anthropic-version: "2023-06-01"
  fg-api-key: "{{fabricKey}}"
order: 2200
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
