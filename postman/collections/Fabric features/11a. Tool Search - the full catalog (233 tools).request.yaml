$kind: http-request
description: "The Postman MCP server behind Fabric, route /mcp/postman, with no plugin. tools/list returns every tool with its full schema: about 233 tools and 400 KB, which an agent would send to the model on every step. The pre-request script opens an MCP session first."
url: "{{fabricUrl}}/mcp/postman"
method: POST
headers:
  Content-Type: application/json
  Accept: "application/json, text/event-stream"
  fg-api-key: "{{fabricKey}}"
  mcp-session-id: "{{mcpSession}}"
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 2,
      "method": "tools/list"
    }
order: 11000
scripts:
  - type: beforeRequest
    code: |-
      const base = pm.variables.replaceIn('{{fabricUrl}}') + '/mcp/postman';
      pm.sendRequest({
        url: base, method: 'POST',
        header: { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', 'fg-api-key': pm.variables.get('fabricKey') },
        body: { mode: 'raw', raw: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-03-26', capabilities: {}, clientInfo: { name: 'postman', version: '1' } } }) },
      }, (err, res) => pm.variables.set('mcpSession', res.headers.get('mcp-session-id')));
    language: text/javascript
  - type: afterResponse
    code: |-
      const tools = pm.response.json().result.tools;
      console.log('tools:', tools.length, '| response bytes:', pm.response.responseSize);
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('The whole catalog comes back (over 100 tools)', () => pm.expect(tools.length).to.be.above(100));
    language: text/javascript
