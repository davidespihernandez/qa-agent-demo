$kind: http-request
description: "The model runs the tool it found through execute_tool. Fabric forwards the call to the Postman MCP server with the key kept in Fabric's vault. Read-only call: returns the profile that owns the API key."
url: "{{fabricUrl}}/mcp/postman-search"
method: POST
headers:
  Content-Type: application/json
  Accept: "application/json, text/event-stream"
  fg-api-key: "{{fabricKey}}"
  mcp-session-id: "{{mcpSession}}"
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 2,
      "method": "tools/call",
      "params": {
        "name": "execute_tool",
        "arguments": {
          "name": "getAuthenticatedUser",
          "arguments": {}
        }
      }
    }
order: 11400
scripts:
  - type: beforeRequest
    code: |-
      const base = pm.variables.replaceIn('{{fabricUrl}}') + '/mcp/postman-search';
      pm.sendRequest({
        url: base, method: 'POST',
        header: { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', 'fg-api-key': pm.variables.get('fabricKey') },
        body: { mode: 'raw', raw: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-03-26', capabilities: {}, clientInfo: { name: 'postman', version: '1' } } }) },
      }, (err, res) => pm.variables.set('mcpSession', res.headers.get('mcp-session-id')));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Tool call succeeded', () => pm.expect(pm.response.json().result.isError).to.not.eql(true));
      pm.test('Returns the user profile', () => pm.expect(pm.response.json().result.content[0].text).to.include('user'));
    language: text/javascript
