$kind: http-request
description: "Same route, a model that is not in the allowlist. Fabric answers 400 and nothing reaches Anthropic: cost control and governance by route."
url: "{{fabricUrl}}/anthropic-select/v1/messages"
method: POST
headers:
  Content-Type: "application/json"
  anthropic-version: "2023-06-01"
  fg-api-key: "{{fabricKey}}"
body:
  type: json
  content: |-
    {
      "model": "claude-opus-4-5",
      "max_tokens": 40,
      "messages": [
        {
          "role": "user",
          "content": "Say hi"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 3100
