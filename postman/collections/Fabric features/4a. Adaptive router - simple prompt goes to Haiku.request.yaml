$kind: http-request
description: "Route anthropic-adaptive (plugin adaptive-model-router, decision service Jev, jev-1.13.0). We ask for claude-sonnet-4-5; look at the model field of the response. Simple prompt: the router picks claude-haiku-5-5. Also Haiku for '2+2', 'capital of France', a translation and 'is 12,500 greater than 10,000?'. Tested 2026-10-21."
url: "{{fabricUrl}}/anthropic-adaptive/v1/messages"
method: POST
headers:
  Content-Type: application/json
  anthropic-version: 2023-06-01
  fg-api-key: "{{fabricKey}}"
body:
  type: json
  content: |-
    {
      "model": "claude-sonnet-4-5",
      "max_tokens": 20,
      "messages": [{ "role": "user", "content": "Say hi" }]
    }
examples: .resources/4a. Adaptive router - simple prompt goes to Haiku.resources/examples
order: 4000
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
