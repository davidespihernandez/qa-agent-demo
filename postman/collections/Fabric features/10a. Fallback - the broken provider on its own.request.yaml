$kind: http-request
description: "Service anthropic-broken has an invalid Anthropic key, standing in for a provider outage. Called directly it returns 401 invalid x-api-key."
url: "{{fabricUrl}}/anthropic-broken/v1/messages"
method: POST
headers:
  Content-Type: "application/json"
  anthropic-version: "2023-06-01"
  fg-api-key: "{{fabricKey}}"
body:
  type: json
  content: |-
    {
      "model": "claude-haiku-4-5-20251001",
      "max_tokens": 40,
      "messages": [
        {
          "role": "user",
          "content": "Say hi"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 10000
