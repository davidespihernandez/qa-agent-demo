$kind: http-request
description: Same GitHub MCP server, but route /mcp/github-search has the tool-search plugin. tools/list now returns only three meta-tools (search_tool, get_tool, execute_tool), about 5 KB instead of 50 KB.
url: "{{fabricUrl}}/mcp/github-search"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json, text/event-stream
  fg-api-key: "{{fabricKey}}"
  mcp-session-id: "{{mcpSession}}"
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 2,
      "method": "tools/list"
    }
examples: .resources/11b. Tool Search - the same server through Tool Search (3 tools).resources/examples
order: 11100
scripts:
  - type: beforeRequest
    code: |-
      const base = pm.variables.replaceIn('{{fabricUrl}}') + '/mcp/github-search';
      pm.sendRequest({
        url: base, method: 'POST',
        header: { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', 'fg-api-key': pm.variables.get('fabricKey') },
        body: { mode: 'raw', raw: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-03-26', capabilities: {}, clientInfo: { name: 'postman', version: '1' } } }) },
      }, (err, res) => pm.variables.set('mcpSession', res.headers.get('mcp-session-id')));
    language: text/javascript
  - type: afterResponse
    code: |-
      const tools = pm.response.json().result.tools;
      console.log('tools:', tools.map(t => t.name).join(', '), '| response bytes:', pm.response.responseSize);
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Only the three meta-tools', () => pm.expect(tools.map(t => t.name).sort()).to.eql(['execute_tool', 'get_tool', 'search_tool']));
    language: text/javascript
