    nel: '{"report_to":"cf-nel","success_fraction":0.0,"max_age":604800}'
    report-to: '{"group":"cf-nel","max_age":604800,"endpoints":[{"url":"https://a.nel.cloudflare.com/report/v4?s=6G1pHL%2F2uokYKgPaGKgL3N8aIubZ7ElWz2cA4jzQ%2FillcY7SpdwJfysCbYDLvJPFzwQLGzG6hzeuUr9ZsmIEIHgVaz8Jg8A3YGozfabcoF3Rv%2F%2Fha5ql9teMx%2FYPaMN2UoniVTz34e5QKq0I0oEGWUycRfpaGboHS8zir5o%3D"}]}'
    content-encoding: br
