$kind: http-example
request:
  url: "{{fabricUrl}}/mcp/postman-search"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json, text/event-stream
    fg-api-key: "{{fabricKey}}"
    mcp-session-id: "{{mcpSession}}"
  body:
    type: json
    content: |-
      {
        "jsonrpc": "2.0",
        "id": 2,
        "method": "tools/list"
      }
response:
  statusCode: 200
  statusText: ""
  headers:
    :status: "200"
