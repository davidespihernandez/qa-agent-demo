$kind: http-example
request:
  url: "{{fabricUrl}}/mcp/github-search"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json, text/event-stream
    fg-api-key: "{{fabricKey}}"
    mcp-session-id: "{{mcpSession}}"
  body:
    type: json
    content: |-
      {
        "jsonrpc": "2.0",
        "id": 2,
        "method": "tools/call",
        "params": {
          "name": "search_tool",
          "arguments": {
            "query": "list open issues in a repository"
          }
        }
      }
response:
  statusCode: 200
  statusText: ""
  headers:
    :status: "200"
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "jsonrpc": "2.0",
        "id": 2,
        "result": {
          "content": [
            {
              "text": "{\"degraded_count\":0,\"results\":[{\"name\":\"issue_read\",\"summary\":\"Get information about a specific issue in a GitHub repository.\",\"score\":0.8912096},{\"name\":\"list_issues\",\"summary\":\"List issues in a GitHub repository. For pagination, use the 'endCursor' from the previous response's 'pageInfo' in the '…\",\"score\":0.88004875},{\"name\":\"list_issue_types\",\"summary\":\"List supported issue types for a repository or its owner organization. When repo is omitted, returns org-level issue typ…\",\"score\":0.87341857},{\"name\":\"list_releases\",\"summary\":\"List releases in a GitHub repository\",\"score\":0.8703547},{\"name\":\"list_issue_fields\",\"summary\":\"List issue fields for a repository or organization. Returns field definitions including name, type (text, number, date, …\",\"score\":0.8637971}]}",
              "type": "text"
            }
          ],
          "isError": false
        }
      }
order: 1000
