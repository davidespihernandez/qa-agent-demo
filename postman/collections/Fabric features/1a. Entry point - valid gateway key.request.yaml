$kind: http-request
description: The caller holds only a Fabric gateway key (fg-api-key). Fabric holds the real Anthropic key in its vault and adds it upstream. Expect 200.
url: "{{fabricUrl}}/anthropic/v1/models"
method: GET
headers:
  anthropic-version: 2023-06-01
  fg-api-key: "{{fabricKey}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
examples: .resources/1a. Entry point - valid gateway key.resources/examples
order: 1000
