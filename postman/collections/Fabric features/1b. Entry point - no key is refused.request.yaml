$kind: http-request
description: "Same call without a key. Fabric refuses it before it reaches Anthropic. Expect 401."
url: "{{fabricUrl}}/anthropic/v1/models"
method: GET
headers:
  anthropic-version: "2023-06-01"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1100
