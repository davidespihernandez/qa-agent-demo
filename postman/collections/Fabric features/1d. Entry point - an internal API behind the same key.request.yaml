$kind: http-request
description: The Orders API through the Fabric route /api. Same gateway key; Fabric adds the API key upstream. The agent and any other client get one way in.
url: "{{fabricUrl}}/api/orders"
method: GET
headers:
  fg-api-key: "{{fabricKey}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
examples: .resources/1d. Entry point - an internal API behind the same key.resources/examples
order: 1300
