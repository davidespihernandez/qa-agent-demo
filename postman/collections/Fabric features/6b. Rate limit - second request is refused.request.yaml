$kind: http-request
description: "Send it right after 6a. Fabric answers 429 and the call never reaches Anthropic. Wait a minute and it passes again. The counter is not exact: with a limit of 1 per minute, the second call has passed in some runs (once the first two both passed and the third got the 429). In a live demo, send 6b again until it is refused."
url: "{{fabricUrl}}{{rateLimitRoute}}/v1/messages"
method: POST
headers:
  Content-Type: "application/json"
  anthropic-version: "2023-06-01"
  fg-api-key: "{{fabricKey}}"
body:
  type: json
  content: |-
    {
      "model": "claude-haiku-4-5-20251001",
      "max_tokens": 40,
      "messages": [
        {
          "role": "user",
          "content": "Say hi"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 429', () => pm.response.to.have.status(429));
    language: text/javascript
order: 6100
