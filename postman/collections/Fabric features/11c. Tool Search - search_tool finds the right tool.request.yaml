$kind: http-request
description: The model describes what it needs and the plugin ranks the whole catalog by meaning (embeddings). The top results are the only tools the model ever has to read about.
url: "{{fabricUrl}}/mcp/github-search"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json, text/event-stream
  fg-api-key: "{{fabricKey}}"
  mcp-session-id: "{{mcpSession}}"
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 2,
      "method": "tools/call",
      "params": {
        "name": "search_tool",
        "arguments": {
          "query": "list open issues in a repository"
        }
      }
    }
examples: .resources/11c. Tool Search - search_tool finds the right tool.resources/examples
order: 11200
scripts:
  - type: beforeRequest
    code: |-
      const base = pm.variables.replaceIn('{{fabricUrl}}') + '/mcp/github-search';
      pm.sendRequest({
        url: base, method: 'POST',
        header: { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', 'fg-api-key': pm.variables.get('fabricKey') },
        body: { mode: 'raw', raw: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-03-26', capabilities: {}, clientInfo: { name: 'postman', version: '1' } } }) },
      }, (err, res) => pm.variables.set('mcpSession', res.headers.get('mcp-session-id')));
    language: text/javascript
  - type: afterResponse
    code: |-
      const text = pm.response.json().result.content[0].text;
      const results = JSON.parse(text).results;
      console.log(results.map(r => r.name + ' ' + r.score.toFixed(2)).join('\n'));
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('An issue tool is among the top results', () => pm.expect(results.map(r => r.name).some(n => ['issue_read', 'list_issues'].includes(n))).to.be.true);
    language: text/javascript
