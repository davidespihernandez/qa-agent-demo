$kind: http-request
description: "Route anthropic-ratelimit has the rate-limit plugin: 1 request per 60 s, counted per consumer (key). The first call is served. If you get 429 here, wait a minute: the window is rolling. Tested 2026-10-21: calls 2+ get 429 (the plugin took a few seconds to apply after saving)."
url: "{{fabricUrl}}{{rateLimitRoute}}/v1/messages"
method: POST
headers:
  Content-Type: "application/json"
  anthropic-version: "2023-06-01"
  fg-api-key: "{{fabricKey}}"
body:
  type: json
  content: |-
    {
      "model": "claude-haiku-4-5-20251001",
      "max_tokens": 40,
      "messages": [
        {
          "role": "user",
          "content": "Say hi"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
