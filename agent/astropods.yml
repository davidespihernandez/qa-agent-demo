# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: fraud-agent

agent:
  build:
    context: .
    dockerfile: Dockerfile
  # Built-in chat (messaging) plus our own HTTP API on port 80 (POST /review) for Postman and curl.
  interfaces:
    frontend: true
    messaging: true
  # Env vars the platform injects into the container. ANTHROPIC_API_KEY comes from the model below.
  inputs:
    - name: LLM_BASE_URL
      datatype: string
      description: Fabric LLM route, e.g. https://<host>/anthropic (arm F). Empty = direct to Anthropic (arm A)
      optional: true
    - name: LLM_BASE_URL_ECONOMY
      datatype: string
      description: Fabric LLM route whose service only allows Haiku 4.5 and Sonnet 4.5, e.g. https://<host>/anthropic-select (arm F-eco)
      optional: true
    - name: LLM_BASE_URL_ADAPTIVE
      datatype: string
      description: Fabric LLM route with the adaptive model router, e.g. https://<host>/anthropic-adaptive (arm D)
      optional: true
    - name: FABRIC_API_URL
      datatype: string
      description: Fabric route to the Orders/Users/Payments APIs, e.g. https://<host>/api (arms F, F-eco, D read data through it)
      optional: true
    - name: FABRIC_GATEWAY_KEY
      datatype: string
      secret: true
      description: Fabric gateway key, the only credential the agent holds on the Fabric arms
      optional: true
    - name: FABRIC_KEY_HEADER
      datatype: string
      description: Header carrying the gateway key on API and MCP routes (default fg-api-key)
      optional: true
    - name: FABRIC_LLM_KEY_HEADER
      datatype: string
      description: Header carrying the gateway key on the LLM routes. Set to fg-api-key (default is Authorization Bearer, which our routes reject)
      optional: true
    - name: MCP_URL
      datatype: string
      description: Fabric MCP route with all tools (arm B)
      optional: true
    - name: MCP_URL_READONLY
      datatype: string
      description: Fabric MCP route with read-only tools (arm B-ro)
      optional: true
    - name: MCP_URL_SEARCH
      datatype: string
      description: Fabric MCP route with Tool Search (arm C)
      optional: true
    - name: FRAUD_WEBHOOK_URL
      datatype: string
      secret: true
      description: Postman Flow webhook, only called on live runs
      optional: true
    - name: DEMO_API_KEY
      datatype: string
      secret: true
      description: Required in the x-demo-key header of POST /review
      optional: true

models:
  anthropic:
    provider: anthropic

dev:
  interfaces:
    frontend:
      port: 8787
    messaging:
      adapters: [web]
